name: Compatibilidad

# La app nativa se publica menos a menudo que la API: en los móviles hay
# siempre una app más antigua que el servidor. Este control comprueba cada
# noche que esa app sigue funcionando.
#
# Coge la última versión etiquetada (vX.Y.Z), que es la web que lleva dentro
# la app publicada en la tienda, la compila y lanza SUS recorridos contra la
# API de UAT de hoy. Si alguien ha cambiado la API de forma que rompe la app
# que ya está en los móviles, se sabe a la mañana siguiente.
#
# Sin etiquetas todavía no hay nada que comprobar y termina en verde.
# Ver docs/VERSIONES.md.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: compat
  cancel-in-progress: true

env:
  E2E_QA_TOKEN: ${{ secrets.E2E_QA_TOKEN }}

jobs:
  app-publicada:
    name: App publicada contra la API de hoy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (con etiquetas)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar la última versión publicada
        id: tag
        run: |
          tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "Todavía no hay ninguna versión etiquetada: nada que comprobar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Versión publicada: $tag" >> "$GITHUB_STEP_SUMMARY"
            git checkout --quiet "$tag"
          fi

      - name: Setup pnpm
        if: steps.tag.outputs.tag != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Setup Node
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.tag.outputs.tag != ''
        run: pnpm install --frozen-lockfile

      - name: Install browser
        if: steps.tag.outputs.tag != ''
        run: pnpm --filter @km0lab/e2e exec playwright install --with-deps chromium

      - name: Compilar la app publicada
        if: steps.tag.outputs.tag != ''
        run: pnpm --filter km0lab build

      - name: Servirla
        if: steps.tag.outputs.tag != ''
        run: |
          pnpm --filter km0lab exec vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "La app compilada no arrancó" && exit 1

      - name: Recorridos de la app publicada contra la API de UAT
        if: steps.tag.outputs.tag != ''
        working-directory: packages/e2e
        env:
          CI: 'true'
          E2E_TARGET: uat
          E2E_BASE_URL: http://localhost:4173
          E2E_RUN_ID: compat${{ github.run_id }}a${{ github.run_attempt }}
        run: |
          if [ -z "$E2E_QA_TOKEN" ]; then export E2E_SCOPE=lectura; fi
          pnpm exec playwright test

      - name: Guardar informe
        if: ${{ !cancelled() && steps.tag.outputs.tag != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: compatibilidad-${{ steps.tag.outputs.tag }}-${{ github.run_id }}
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
