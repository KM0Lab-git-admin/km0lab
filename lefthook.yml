# https://lefthook.dev/configuration/

# Solo afecta a archivos staged (no a todo el repo).
# Para saltarse los hooks puntualmente: LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  commands:
    format-check:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm eslint {staged_files}

# Tramo rápido: lo que corre en tu máquina antes de que algo salga de ella.
# Sin navegador y sin servidores: segundos. Los recorridos completos
# (packages/e2e) corren después, ya en UAT. Ver docs/TESTING.md.
pre-push:
  parallel: true
  commands:
    type-check:
      run: pnpm turbo run type:check
    test:
      run: pnpm turbo run test
